- defaults:
    link:
      relink: true

- clean: ['~']

- shell:
  - [git submodule update --init --recursive, Installing submodules]

- link:
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf

    ~/.config/fish/config.fish: config.fish
    ~/.config/nvim: nvim
    ~/.config/alacritty: alacritty

